<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grandes Batalhas</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#e6dabd; --panel:#f4ecd8; --card:#e9dec3; --ink:#2b2824; --muted:#6b6250; --gold:#8c2a1c; --red:#b03a2e; --blue:#3b5168; --line:#cdbf9f; --side:310px; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:Inter, sans-serif; overflow:hidden; }
  button { font:inherit; color:inherit; cursor:pointer; }

  /* Sidebar: title, search, filters, chronological list */
  #side { position:absolute; z-index:1002; top:0; left:0; bottom:0; width:var(--side); background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; }
  .head { padding:16px 16px 10px; }
  .head h1 { margin:0 0 6px; font-family:"Playfair Display", serif; color:var(--ink); font-size:1.7rem; border-bottom:3px double var(--gold); padding-bottom:6px; }
  .head p { margin:2px 0 12px; color:var(--muted); font-size:.82rem; }
  #q { width:100%; padding:9px 12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); font:inherit; font-size:.9rem; }
  #q:focus { outline:none; border-color:var(--gold); }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .chips button { font-size:.74rem; padding:5px 10px; border-radius:20px; border:1px solid var(--line); background:var(--card); display:flex; align-items:center; gap:5px; }
  .chips button.on { border-color:var(--gold); color:var(--gold); }
  .chips i { width:8px; height:8px; border-radius:50%; display:inline-block; }
  .row2 { display:flex; gap:6px; margin-top:8px; }
  .row2 button { flex:1; font-size:.76rem; padding:7px; border-radius:10px; border:1px solid var(--line); background:var(--card); }
  .row2 button.on { border-color:var(--gold); color:var(--gold); }
  #count { padding:6px 16px; font-size:.72rem; color:var(--muted); border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
  #list { flex:1; overflow-y:auto; }
  .item { display:flex; gap:10px; align-items:baseline; width:100%; text-align:left; padding:9px 16px; background:none; border:none; border-bottom:1px solid var(--line); }
  .item:hover, .item.sel { background:var(--card); }
  .item .y { flex:none; width:62px; font-size:.74rem; color:var(--muted); text-align:right; }
  .item .n { font-size:.92rem; }
  .item .n small { display:block; color:var(--muted); font-size:.72rem; }
  .item .f { margin-left:auto; color:var(--gold); font-size:.7rem; }
  .item .d { flex:none; width:8px; height:8px; border-radius:50%; align-self:center; }

  #map { position:absolute; top:0; bottom:0; left:var(--side); right:0; background:#0e1a24; }
  .pin { width:18px; height:18px; border-radius:50%; background:var(--c); border:2px solid #f4ecd8; box-shadow:0 0 0 1px #2b2824, 0 1px 6px #0008; display:grid; place-items:center; font-size:9px; color:#fff; line-height:1; }
  .pin.basic { width:12px; height:12px; margin:3px; border-width:1.5px; }
  .pin.sel { box-shadow:0 0 0 3px #2b2824, 0 0 0 6px #f4ecd8, 0 2px 10px #000; transform:scale(1.3); }
  .cl { width:32px; height:32px; border-radius:50%; background:var(--panel); color:var(--ink); border:2px solid var(--ink); display:grid; place-items:center; font-weight:600; font-size:.8rem; box-shadow:0 1px 8px #000a; }
  .leaflet-tooltip { background:var(--panel); color:var(--ink); border:1px solid var(--line); font-family:Inter, sans-serif; }
  .leaflet-tooltip-top:before { border-top-color:var(--line); }

  /* Battle panel */
  #panel { position:absolute; z-index:1003; top:0; right:0; bottom:0; width:440px; max-width:100%; background:var(--panel); border-left:1px solid var(--line); overflow-y:auto; padding:20px; transform:translateX(100%); transition:transform .3s; }
  #panel.open { transform:none; }
  #close { float:right; font-size:1.5rem; background:none; border:none; color:var(--muted); line-height:1; }
  .era-tag { font-size:.7rem; text-transform:uppercase; letter-spacing:.08em; }
  #panel h2 { font-family:"Playfair Display", serif; font-size:2rem; margin:2px 0 4px; color:var(--ink); }
  .meta { color:var(--muted); font-size:.9rem; margin-bottom:16px; }
  .sides { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:8px; }
  .side { background:var(--card); border-radius:10px; padding:10px; font-size:.84rem; border-top:3px solid var(--blue); line-height:1.4; }
  .side.b { border-top-color:var(--red); }
  .side b { display:block; font-size:.95rem; margin-bottom:4px; }
  .side .win { color:var(--gold); font-weight:600; font-size:.72rem; margin-top:4px; }
  .draw { text-align:center; font-size:.75rem; color:var(--gold); font-weight:600; margin-bottom:6px; }
  .strength { display:flex; height:10px; border-radius:5px; overflow:hidden; margin:6px 0 4px; }
  .strength div:first-child { background:var(--blue); } .strength div:last-child { background:var(--red); }
  .note { font-size:.72rem; color:var(--muted); margin-bottom:14px; }
  h3 { font-size:.78rem; text-transform:uppercase; letter-spacing:.08em; color:var(--gold); margin:20px 0 8px; }
  .phase { display:flex; gap:10px; margin-bottom:10px; line-height:1.5; font-size:.95rem; }
  .phase span { flex:none; width:24px; height:24px; border-radius:50%; background:var(--gold); color:#fff; display:grid; place-items:center; font-weight:600; font-size:.8rem; }
  #panel p { line-height:1.55; margin:0 0 8px; }
  .more { display:inline-block; margin-top:10px; color:var(--gold); }
  .navb { display:flex; gap:8px; margin-top:20px; }
  .navb button { flex:1; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--card); }
  .navb button:disabled { opacity:.35; cursor:default; }

  /* Deployment diagram */
  .field { background:#efe5c8; border:1px solid var(--line); border-radius:10px; display:block; width:100%; }
  .field .u { transition:transform 1.2s ease, opacity 1.2s ease; }
  .field .u.gone { opacity:.22; }
  .field .a { fill:var(--blue); } .field .b { fill:var(--red); }
  .field .shape { stroke:#2b2824; stroke-width:.35; }
  .field .mark { stroke:#f4ecd8; stroke-width:.4; fill:none; }
  .field .lab { font-size:2.5px; fill:var(--ink); text-anchor:middle; paint-order:stroke; stroke:#efe5c8; stroke-width:.8px; font-family:Inter, sans-serif; }
  .field .ter { font-size:2.6px; fill:#6b6250; text-anchor:middle; font-style:italic; font-family:Inter, sans-serif; }
  .field .arrow { stroke-width:.7; stroke-dasharray:1.6 1; fill:none; opacity:.85; animation:fadein 1.2s; }
  .field .arrow.a { stroke:var(--blue); } .field .arrow.b { stroke:var(--red); }
  .field .ghost { fill:none; stroke-width:.3; stroke-dasharray:.8 .8; opacity:.6; }
  .field .ghost.a { stroke:var(--blue); } .field .ghost.b { stroke:var(--red); }
  .field marker path.a { fill:var(--blue); } .field marker path.b { fill:var(--red); }
  @keyframes fadein { from { opacity:0; } }
  .ctl button:disabled { opacity:.35; cursor:default; }
  .cap { background:var(--card); border-radius:10px; padding:10px 12px; margin-top:8px; font-size:.92rem; line-height:1.5; min-height:5.2em; }
  .ctl { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; align-items:center; }
  .ctl button { min-width:34px; padding:7px 9px !important; }
  .ctl button { padding:8px 12px; border-radius:10px; border:1px solid var(--line); background:var(--card); }
  .ctl button.on { background:var(--gold); color:#fff; border-color:var(--gold); font-weight:600; }
  .ctl .sp { flex:1; }
  .legend { font-size:.7rem; color:var(--muted); margin-top:6px; line-height:1.9; }
  .legend span { white-space:nowrap; margin-right:10px; }
  .lg { width:20px; height:12px; vertical-align:-2px; margin-right:3px; }
  .lg .shape { fill:#8d8371; stroke:#2b2824; stroke-width:.5; } .lg .mark { stroke:#f4ecd8; stroke-width:.6; fill:none; }
  .field .mark.dot, .lg .mark.dot { fill:#f4ecd8; stroke:none; }
  #lang { float:right; font-size:.72rem; padding:4px 9px; border-radius:20px; border:1px solid var(--line); background:var(--card); margin-top:6px; }
  #lang:hover { border-color:var(--gold); color:var(--gold); }

  #timeline { position:absolute; z-index:1000; left:calc(var(--side) + 12px); right:12px; bottom:22px; height:54px; background:#f4ecd8ee; border:1px solid var(--line); border-radius:10px; box-shadow:0 2px 10px #0004; }
  #timeline .track { position:absolute; left:18px; right:18px; top:0; bottom:0; }
  #timeline .dot { position:absolute; width:7px; height:7px; margin-left:-3.5px; border-radius:50%; border:1px solid #f4ecd8; padding:0; }
  #timeline .dot:hover, #timeline .dot.sel { transform:scale(2.2); border-color:#2b2824; z-index:2; }
  #timeline .tick { position:absolute; bottom:3px; font-size:.62rem; color:var(--muted); transform:translateX(-50%); white-space:nowrap; }
  #timeline .tick:before { content:""; position:absolute; left:50%; bottom:13px; height:34px; border-left:1px dashed var(--line); }
  @media (min-width:761px) { body.po #timeline { right:452px; } }
  .badge { display:inline-block; font-size:.7rem; font-weight:600; padding:3px 8px; border-radius:20px; background:#3d7a3a; color:#fff; margin-bottom:10px; }
  .fact-row { font-size:.88rem; line-height:1.45; margin-bottom:8px; }
  .fact-row b { display:block; font-size:.7rem; text-transform:uppercase; letter-spacing:.08em; color:var(--gold); }
  .wiki { background:var(--card); border-radius:10px; padding:12px; margin-top:12px; font-size:.93rem; line-height:1.55; color:var(--muted); }
  .wiki img { display:block; max-width:100%; max-height:240px; margin:0 auto 10px; border-radius:6px; }
  .wiki p { color:var(--ink); }
  .wiki small { display:block; font-size:.68rem; color:var(--muted); }
  .badge.deep { background:var(--gold); }
  .hook { font-family:"Playfair Display", serif; font-size:1.15rem; line-height:1.4; margin:4px 0 14px !important; }
  .toc { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin:16px 0 4px; }
  .toc a { text-decoration:none; color:var(--ink); background:var(--card); border-radius:8px; padding:8px 10px; font-size:.85rem; }
  .toc a b { color:var(--gold); margin-right:4px; }
  .chapter { border-top:1px solid var(--line); margin-top:22px; padding-top:4px; }
  .chapter h3 { font-family:"Playfair Display", serif; text-transform:none; letter-spacing:0; font-size:1.45rem; color:var(--ink); display:flex; align-items:baseline; gap:10px; }
  .chapter h3 span { color:var(--gold); font-size:1rem; }
  .chapter h4 { margin:18px 0 6px; font-size:.95rem; color:var(--gold); }
  .chapter p { font-size:.98rem; line-height:1.65 !important; }
  .callout { background:var(--card); border-left:3px solid var(--gold); padding:10px 12px; border-radius:0 8px 8px 0; font-size:.88rem; line-height:1.5; margin:10px 0; }
  .chrono { list-style:none; padding:0; margin:10px 0 14px; border-left:2px solid var(--gold); }
  .chrono li { position:relative; padding:0 0 10px 16px; font-size:.9rem; line-height:1.45; }
  .chrono li:before { content:""; position:absolute; left:-6px; top:5px; width:10px; height:10px; border-radius:50%; background:var(--gold); }
  .chrono b { display:block; }
  .recon { font-size:.72rem; color:var(--muted); font-style:italic; margin-top:4px; }
  .term { font:inherit; color:inherit; background:none; border:none; padding:0; border-bottom:1.5px dotted var(--gold); cursor:help; }
  .gpop { position:absolute; left:20px; right:20px; z-index:5; background:var(--ink); color:var(--panel); padding:12px 14px; border-radius:10px; font-size:.86rem; line-height:1.5; box-shadow:0 4px 16px #0006; }
  .gpop b { display:block; text-transform:capitalize; color:#e9c46a; margin-bottom:2px; }
  #panel { position:absolute; }
  .unchecked { font-size:.72rem; color:var(--muted); font-style:italic; margin-top:14px; }
  .src { font-size:.82rem; line-height:1.5; padding-left:18px; margin:0; }
  .src a { color:var(--gold); }
  .links { display:flex; flex-wrap:wrap; gap:6px; }
  .links button { font-size:.8rem; padding:6px 10px; border-radius:20px; border:1px solid var(--line); background:var(--card); }
  .links button:hover { border-color:var(--gold); color:var(--gold); }
  .leaflet-control-attribution { background:#f4ecd8cc !important; }

  #menu { display:none; }
  @media (max-width:760px) {
    :root { --side:0px; }
    #side { width:86%; max-width:340px; transform:translateX(-100%); transition:transform .3s; }
    #side.open { transform:none; box-shadow:0 0 40px #0008; }
    #menu { display:block; position:absolute; z-index:1001; top:10px; left:10px; padding:9px 14px; border-radius:10px; border:1px solid var(--gold); background:var(--panel); color:var(--gold); font-weight:600; }
    #timeline { left:8px; right:8px; bottom:20px; }
    #timeline .tick:nth-of-type(2n) { display:none; }
    #panel { top:auto; height:68%; width:100%; border-left:none; border-top:1px solid var(--line); border-radius:16px 16px 0 0; transform:translateY(100%); }
    #panel.drag { transition:none; }
    /* Grab handle: the sheet can be swiped down to close it. */
    #panel::before { content:""; display:block; width:44px; height:5px; border-radius:3px; background:var(--line); margin:-10px auto 10px; }
  }
</style>
</head>
<body>
<div id="map"></div>
<button id="menu"></button>
<div id="timeline"><div class="track" id="track"></div></div>

<nav id="side">
  <div class="head">
    <button id="lang" title="Language / Idioma"></button>
    <h1 id="title"></h1>
    <p id="sub"></p>
    <input id="q" type="search" autocomplete="off">
    <div class="chips" id="eras"></div>
    <div class="chips" id="conts"></div>
    <div class="row2">
      <button id="random"></button>
    </div>
  </div>
  <div id="count"></div>
  <div id="list"></div>
</nav>

<aside id="panel"></aside>

<script src="analytics.js?v=2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script>
// Language: English by default; Portuguese with ?lang=pt or the toggle. The English data files live in en/.
const V = 37;
const LANGS = ["en", "pt"], DEFAULT_LANG = "en";
let LANG = new URLSearchParams(location.search).get("lang");
try { if (LANGS.includes(LANG)) localStorage.setItem("lang", LANG); else LANG = localStorage.getItem("lang"); } catch (e) {}
if (!LANGS.includes(LANG)) LANG = DEFAULT_LANG;
document.documentElement.lang = LANG === "pt" ? "pt-BR" : "en";
const DATA_FILES = ["battles", "battles2", "battles3", "battles4", "battles5", "battles6", "formations", "featured", "deep", "deep_a", "deep_b", "deep_c", "deep_d", "deep_e", "deep_f", "deep_g", "deep_h", "deep_i", "deep_j", "deep_k", "deep_l", "deep_m", "deep_n", "deep_o", "deep_p", "deep_q", "deep_r", "deep_s", "deep_t", "deep_u", "deep_v", "deep_w", "deep_x", "deep_y", "deep_z", "deep_aa", "deep_ab", "deep_ac", "deep_ad", "deep_ae", "deep_af", "deep_ag", "deep_ah", "deep_ai", "deep_aj", "deep_ak", "deep_al", "deep_am"];
document.write(DATA_FILES.map(f => `<script src="${LANG === "en" ? "en/" : ""}${f}.js?v=${V}"><\/script>`).join("") +
  `<script src="battles_wd.js?v=${V}"><\/script><script src="unit_kinds.js?v=${V}"><\/script>`);
</script>
<script>
const STR = {
  pt: {
    title: "Grandes Batalhas", sub: "Escolha na lista ou clique no mapa.", search: "Buscar batalha, general ou lugar",
    random: "Sortear uma batalha", menu: "☰ Batalhas", other: "English",
    eras: { todas: "Todas", antiga: "Antiguidade", medieval: "Idade Média", moderna: "Idade Moderna", contemporanea: "Século XX" },
    conts: { todos: "Mundo", europa: "Europa", asia: "Ásia e Oriente Médio", africa: "África", americas: "Américas", pacifico: "Oceania e Pacífico" },
    bc: y => `${y} a.C.`, mapNote: "Fronteiras e nomes do mapa são atuais, não os da época",
    count: (n, t) => `${n} de ${t} batalhas, da mais antiga à mais recente`, none: "Nenhuma batalha encontrada.",
    hasDiagram: "Com disposição dos exércitos", close: "Fechar", winner: "VENCEDOR", draw: "RESULTADO INDECISO",
    sizes: "Tamanho das forças (estimativas dos historiadores)", sizesUnknown: "Tamanho das forças desconhecido ou incerto",
    deployment: "Disposição dos exércitos", how: "Como foi a batalha", result: "Resultado", losses: "Baixas", why: "Por que importa",
    linked: "Batalhas ligadas", sources: "Fontes", more: "Ler mais na Wikipédia →", prev: "← Anterior", next: "Próxima →",
    war: "Guerra", parts: "Participantes", wikiLoading: "Carregando o resumo da Wikipédia…", wikiFull: "Ler o artigo completo na Wikipédia →",
    basicNote: "Ficha básica: os dados vêm do Wikidata e o resumo, da Wikipédia. Ainda não tem texto próprio nem disposição dos exércitos.",
    wikiNone: "A Wikipédia não tem resumo para este artigo.", wikiFail: "Não consegui carregar o resumo agora. O link abaixo abre o artigo.",
    wikiCredit: en => `Texto e imagem: Wikipédia${en ? " em inglês" : ""}, licença CC BY-SA. A imagem pode ter outra licença; veja o artigo.`,
    diagramOf: n => `Esquema da batalha de ${n}`, stepPrev: "Passo anterior", stepNext: "Próximo passo", play: "Animar", pause: "Pausar",
    stepOf: (k, n) => `${k} de ${n}.`, arrows: "as setas mostram o movimento desde o passo anterior", scale: "esquema simplificado, fora de escala",
    kinds: { inf: "infantaria", cav: "cavalaria", art: "artilharia", tank: "blindados", air: "aviões", ship: "navios", ele: "elefantes ou camelos", car: "carros ou carroças", camp: "acampamento, forte ou posição fixa" },
    recon: y => `Reconstrução simplificada a partir ${y < 500 ? "dos relatos antigos" : y < 1500 ? "das crônicas da época" : y < 1900 ? "dos relatos e documentos da época" : "dos documentos da época"} e dos historiadores modernos. Posições e movimentos são aproximados.`
  },
  en: {
    title: "Great Battles", sub: "Pick one from the list or click the map.", search: "Search battle, commander or place",
    random: "Pick a random battle", menu: "☰ Battles", other: "Português",
    eras: { todas: "All", antiga: "Antiquity", medieval: "Middle Ages", moderna: "Early Modern", contemporanea: "20th Century" },
    conts: { todos: "World", europa: "Europe", asia: "Asia and Middle East", africa: "Africa", americas: "Americas", pacifico: "Oceania and Pacific" },
    bc: y => `${y} BC`, mapNote: "Map borders and names are today's, not those of the time",
    count: (n, t) => `${n} of ${t} battles, oldest to most recent`, none: "No battle found.",
    hasDiagram: "With army deployment", close: "Close", winner: "WINNER", draw: "INDECISIVE",
    sizes: "Size of the forces (historians' estimates)", sizesUnknown: "Size of the forces unknown or uncertain",
    deployment: "Army deployment", how: "How the battle went", result: "Result", losses: "Losses", why: "Why it matters",
    linked: "Linked battles", sources: "Sources", more: "Read more on Wikipedia →", prev: "← Previous", next: "Next →",
    war: "War", parts: "Belligerents", wikiLoading: "Loading the Wikipedia summary…", wikiFull: "Read the full article on Wikipedia →",
    basicNote: "Basic entry: the data comes from Wikidata and the summary from Wikipedia. It has no text of its own or army deployment yet.",
    wikiNone: "Wikipedia has no summary for this article.", wikiFail: "The summary could not be loaded right now. The link below opens the article.",
    wikiCredit: en => `Text and image: ${en ? "English" : "Portuguese"} Wikipedia, CC BY-SA licence. The image may have a different licence; see the article.`,
    diagramOf: n => `Diagram of the battle of ${n}`, stepPrev: "Previous step", stepNext: "Next step", play: "Play", pause: "Pause",
    stepOf: (k, n) => `${k} of ${n}.`, arrows: "arrows show the movement since the previous step", scale: "simplified diagram, not to scale",
    kinds: { inf: "infantry", cav: "cavalry", art: "artillery", tank: "armour", air: "aircraft", ship: "ships", ele: "elephants or camels", car: "chariots or wagons", camp: "camp, fort or fixed position" },
    recon: y => `Simplified reconstruction from ${y < 500 ? "the ancient accounts" : y < 1500 ? "the chronicles of the time" : y < 1900 ? "accounts and documents of the time" : "documents of the time"} and modern historians. Positions and movements are approximate.`
  }
};
const S = STR[LANG];
document.title = S.title;
// Symbol corrections shared by both languages.
Object.entries(UNIT_KINDS).forEach(([id, m]) => (FORMATIONS[id] ? FORMATIONS[id].units : []).forEach(u => { if (m[u.id]) u.k = m[u.id]; }));
const ERAS = {
  todas: [S.eras.todas, null],
  antiga: [S.eras.antiga, "#a8730f"],
  medieval: [S.eras.medieval, "#3d7a3a"],
  moderna: [S.eras.moderna, "#2c6aa0"],
  contemporanea: [S.eras.contemporanea, "#b03a2e"]
};
const $ = id => document.getElementById(id);
// Wikidata entries only have a short summary; they stay hidden unless the reader asks for them.
const SHOW_BASIC = new URLSearchParams(location.search).has("todas");
if (SHOW_BASIC) BATTLES.push(...WD_BATTLES);
// Apply the source-checked overrides, then build the two-way connections.
Object.entries(FEATURED).forEach(([id, f]) => {
  const b = BATTLES.find(x => x.id === id); if (!b) return;
  ["place", "lat", "lng"].forEach(k => { if (f[k] !== undefined) b[k] = f[k]; });
  Object.assign(b.a, f.a); Object.assign(b.b, f.b);
});
const linked = {};
Object.entries(LINKS).forEach(([from, tos]) => tos.forEach(to => {
  (linked[from] ??= new Set()).add(to); (linked[to] ??= new Set()).add(from);
}));
// Timeline scale: early centuries are compressed, recent ones stretched, so dots do not pile up.
const T_ANCHORS = [[-1500, 0], [-500, 0.13], [500, 0.36], [1500, 0.6], [1800, 0.77], [1900, 0.88], [1960, 1]];
function tpos(year) {
  for (let i = 1; i < T_ANCHORS.length; i++) {
    const [y0, p0] = T_ANCHORS[i - 1], [y1, p1] = T_ANCHORS[i];
    if (year <= y1) return p0 + (Math.max(year, y0) - y0) / (y1 - y0) * (p1 - p0);
  }
  return 1;
}
const sorted = [...BATTLES].sort((x, y) => x.year - y.year);
const byId = Object.fromEntries(BATTLES.map(b => [b.id, b]));
const state = { era: "todas", cont: "todos", q: "", current: null };
const CONTS = S.conts;
// Rough geographic boxes; good enough to sort battles into five groups.
function continent(b) {
  const { lat, lng } = b;
  if (lng < -140 || (lng > 140 && lat < 22) || (lng > 110 && lat < -10)) return "pacifico";
  if (lng < -30) return "americas";
  // Northern edge of Africa, which sits further north in Tunisia than in Morocco or Libya.
  const africaTop = lng < -1 ? 35.95 : lng < 2 ? 36.2 : lng < 11.5 ? 37.4 : 34;
  const levant = lng > 32.6 && lat > 29, arabia = (lng > 36.5 && lat > 16) || (lng > 42.5 && lat > 12.5);
  if (lng >= -20 && lng <= 52 && lat < africaTop && !levant && !arabia) return "africa";
  const anatolia = lng > 26.2 && lat < 42 && !(lng < 29.2 && lat > 40.6), caucasus = lng > 40 && lat < 43.5;
  if (lat > 35.5 && lng > -25 && lng < 45 && !anatolia && !caucasus) return "europa";
  return "asia";
}
const fmtYear = y => y < 0 ? S.bc(-y) : `${y}`;
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

// ---------- Map ----------
const map = L.map("map", { worldCopyJump: true, zoomControl: false, minZoom: 2 }).setView([30, 20], 3);
L.control.zoom({ position: "topright" }).addTo(map);
map.attributionControl.setPrefix(S.mapNote);
// Esri tiles work without a key for local use. OpenStreetMap's servers refuse pages opened from disk.
// Before a public launch, switch to a provider with a key (see README).
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/NatGeo_World_Map/MapServer/tile/{z}/{y}/{x}", {
  attribution: "Tiles &copy; Esri, National Geographic", maxZoom: 12
}).addTo(map);

const pinIcon = (b, sel) => L.divIcon({
  className: "", iconSize: [18, 18], iconAnchor: [9, 9],
  html: `<div class="pin ${b.basic ? "basic" : ""} ${sel ? "sel" : ""}" style="--c:${ERAS[b.era][1]}">${FORMATIONS[b.id] ? "◆" : ""}</div>`
});
const cluster = L.markerClusterGroup({
  maxClusterRadius: 30, showCoverageOnHover: false,
  iconCreateFunction: c => L.divIcon({ className: "", iconSize: [32, 32], html: `<div class="cl">${c.getChildCount()}</div>` })
});
const markers = {};
sorted.forEach(b => {
  markers[b.id] = L.marker([b.lat, b.lng], { icon: pinIcon(b, false) })
    .bindTooltip(`${b.name} · ${fmtYear(b.year)}`, { direction: "top", offset: [0, -8] })
    .on("click", () => openBattle(b.id));
});
map.addLayer(cluster);

// ---------- Filters and list ----------
function visible() {
  const q = norm(state.q.trim());
  return sorted.filter(b =>
    (state.era === "todas" || b.era === state.era) &&
    (state.cont === "todos" || continent(b) === state.cont) &&
    (!q || norm(b.basic ? `${b.name} ${b.place} ${b.war} ${b.parts.join(" ")} ${fmtYear(b.year)}` : `${b.name} ${b.place} ${b.a.leader} ${b.b.leader} ${b.a.side} ${b.b.side} ${fmtYear(b.year)}`).includes(q)));
}

function refresh(fit) {
  const list = visible();
  cluster.clearLayers();
  cluster.addLayers(list.map(b => markers[b.id]));
  $("count").textContent = S.count(list.length, sorted.length);
  $("list").innerHTML = list.map(b => `
    <button class="item ${b.id === state.current ? "sel" : ""}" data-id="${b.id}">
      <span class="y">${fmtYear(b.year)}</span>
      <i class="d" style="background:${ERAS[b.era][1]}"></i>
      <span class="n">${b.name}<small>${b.place}</small></span>
      ${FORMATIONS[b.id] ? '<span class="f" title="${S.hasDiagram}">◆</span>' : ""}
    </button>`).join("") || `<p style="padding:16px;color:var(--muted)">${S.none}</p>`;
  $("track").innerHTML =
    T_ANCHORS.slice(0, -1).map(([y, p]) => `<span class="tick" style="left:${p * 100}%">${fmtYear(y)}</span>`).join("") +
    list.map((b, k) => `<button class="dot ${b.id === state.current ? "sel" : ""}" data-id="${b.id}" title="${b.name} · ${fmtYear(b.year)}" style="left:${tpos(b.year) * 100}%;top:${4 + (k % 4) * 7.5}px;background:${ERAS[b.era][1]}"></button>`).join("");
  if (fit && list.length && map.getSize().x > 0)
    map.flyToBounds(L.latLngBounds(list.map(b => [b.lat, b.lng])).pad(0.25), { maxZoom: 6, duration: 0.9 });
}

$("eras").innerHTML = Object.entries(ERAS).map(([k, [label, color]]) =>
  `<button data-era="${k}" class="${k === state.era ? "on" : ""}">${color ? `<i style="background:${color}"></i>` : ""}${label}</button>`).join("");
$("eras").onclick = e => {
  const btn = e.target.closest("button"); if (!btn) return;
  state.era = btn.dataset.era;
  [...$("eras").children].forEach(c => c.classList.toggle("on", c === btn));
  refresh(true);
};
$("conts").innerHTML = Object.entries(CONTS).map(([k, label]) => `<button data-cont="${k}" class="${k === state.cont ? "on" : ""}">${label}</button>`).join("");
$("conts").onclick = e => {
  const btn = e.target.closest("button"); if (!btn) return;
  state.cont = btn.dataset.cont;
  [...$("conts").children].forEach(c => c.classList.toggle("on", c === btn));
  refresh(true);
};
$("q").oninput = e => { state.q = e.target.value; refresh(false); };
$("random").onclick = () => { const l = visible(); if (l.length) openBattle(l[Math.floor(Math.random() * l.length)].id); };
$("list").onclick = e => { const it = e.target.closest(".item"); if (it) openBattle(it.dataset.id); };
$("track").onclick = e => { const d = e.target.closest(".dot"); if (d) openBattle(d.dataset.id); };
$("menu").onclick = () => $("side").classList.toggle("open");
map.on("click", () => $("side").classList.remove("open"));

// ---------- Battle panel ----------
function wikiQuery(b) {
  return /^(Cerco|Queda|Tomada|Batalha|Grande|Invencível|Dia D|Canudos|Pearl|Planícies)/.test(b.name) ? `${b.name} ${Math.abs(b.year)}` : `Batalha de ${b.name}`;
}

function openBattle(id) {
  const b = byId[id]; if (!b) return;
  Analytics.track("battle_opened", { battle_id: id, lang: LANG });
  if (state.current && markers[state.current]) markers[state.current].setIcon(pinIcon(byId[state.current], false));
  state.current = id;
  markers[id].setIcon(pinIcon(b, true));
  $("side").classList.remove("open");
  document.querySelectorAll(".item.sel, .dot.sel").forEach(i => i.classList.remove("sel"));
  const dot = document.querySelector(`.dot[data-id="${id}"]`); if (dot) dot.classList.add("sel");
  const it = document.querySelector(`.item[data-id="${id}"]`);
  if (it) { it.classList.add("sel"); it.scrollIntoView({ block: "nearest" }); }

  const z = Math.max(map.getZoom(), 6);
  // flyTo breaks on a zero-size map (e.g. a hidden tab); fall back to a plain jump.
  if (map.getSize().x > 0) map.flyTo([b.lat, b.lng], z, { duration: 1.1 }); else map.setView([b.lat, b.lng], z);

  if (b.basic) return renderBasic(b);
  if (DEEP[id]) return renderDeep(b, DEEP[id]);

  const known = b.a.n > 0 && b.b.n > 0, pa = known ? Math.round(b.a.n / (b.a.n + b.b.n) * 100) : 50;
  const side = (s, cls, won) => `<div class="side ${cls}"><b>${s.side}</b>${s.leader}<br>${s.troops}${won ? `<div class="win">${S.winner}</div>` : ""}</div>`;
  const ft = FEATURED[id], conn = [...(linked[id] || [])].map(x => byId[x]).filter(Boolean).sort((x, y) => x.year - y.year);
  const list = visible(), i = list.findIndex(x => x.id === id);
  const prev = i > 0 ? list[i - 1].id : "", next = i >= 0 && i < list.length - 1 ? list[i + 1].id : "";

  $("panel").innerHTML = `
    <button id="close" onclick="closePanel()" aria-label="${S.close}">×</button>
    <div class="era-tag" style="color:${ERAS[b.era][1]}">${ERAS[b.era][0]}</div>
    <h2>${b.name}</h2>
    <div class="meta">${b.date} · ${b.place}</div>
    <div class="sides">${side(b.a, "a", b.winner === "a")}${side(b.b, "b", b.winner === "b")}</div>
    ${b.winner ? "" : `<div class="draw">${S.draw}</div>`}
    ${known ? `<div class="strength"><div style="width:${pa}%"></div><div style="width:${100 - pa}%"></div></div>
    <div class="note">${S.sizes}</div>` : `<div class="note">${S.sizesUnknown}</div>`}
    <p>${ft ? ft.narrative : b.summary}</p>
    ${FORMATIONS[id] ? `<h3>${S.deployment}</h3><div id="formation"></div>` : ""}
    <h3>${S.how}</h3>
    ${b.phases.map((p, k) => `<div class="phase"><span>${k + 1}</span><div>${p}</div></div>`).join("")}
    <h3>${S.result}</h3><p>${b.result}</p>
    ${ft ? `<h3>${S.losses}</h3><p>${ft.losses}</p>` : ""}
    <h3>${S.why}</h3><p>${b.legacy}</p>
    ${conn.length ? `<h3>${S.linked}</h3><div class="links">${conn.map(c => `<button onclick="openBattle('${c.id}')">${c.name} · ${fmtYear(c.year)}</button>`).join("")}</div>` : ""}
    ${ft ? `<h3>${S.sources}</h3><ul class="src">${ft.sources.map(([t, u]) => `<li>${u ? `<a href="${u}" target="_blank" rel="noopener">${t}</a>` : t}</li>`).join("")}</ul>`
         : ""}
    <a class="more" target="_blank" rel="noopener" href="https://${LANG}.wikipedia.org/w/index.php?search=${encodeURIComponent(wikiQuery(b))}">${S.more}</a>
    <div class="navb">
      <button ${prev ? "" : "disabled"} onclick="openBattle('${prev}')">${S.prev}</button>
      <button ${next ? "" : "disabled"} onclick="openBattle('${next}')">${S.next}</button>
    </div>`;
  $("panel").classList.add("open");
  document.body.classList.add("po");
  $("panel").scrollTop = 0;
  if (FORMATIONS[id]) drawFormation(b, FORMATIONS[id]);
  history.replaceState(null, "", "#" + id);
}

// ---------- In-depth battles ----------
function gloss(text) {
  return text.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (_, shown, key) => {
    const k = (key || shown).toLowerCase();
    return GLOSSARY[k] ? `<button class="term" data-k="${k}">${shown}</button>` : shown;
  });
}
function renderBlock(x) {
  if (typeof x === "string") return `<p>${gloss(x)}</p>`;
  if (x.h) return `<h4>${x.h}</h4>`;
  if (x.note) return `<div class="callout">${gloss(x.note)}</div>`;
  if (x.timeline) return `<ol class="chrono">${x.timeline.map(([w, t]) => `<li><b>${w}</b><span>${gloss(t)}</span></li>`).join("")}</ol>`;
  if (x.formation) return `<div id="formation"></div>`;
  return "";
}
function renderDeep(b, d) {
  const id = b.id, ft = FEATURED[id];
  const conn = [...(linked[id] || [])].map(x => byId[x]).filter(Boolean).sort((x, y) => x.year - y.year);
  const list = visible(), i = list.findIndex(x => x.id === id);
  const prev = i > 0 ? list[i - 1].id : "", next = i >= 0 && i < list.length - 1 ? list[i + 1].id : "";
  const known = b.a.n > 0 && b.b.n > 0, pa = known ? Math.round(b.a.n / (b.a.n + b.b.n) * 100) : 50;
  const side = (s, cls, won) => `<div class="side ${cls}"><b>${s.side}</b>${s.leader}<br>${s.troops}${won ? `<div class="win">${S.winner}</div>` : ""}</div>`;
  $("panel").innerHTML = `
    <button id="close" onclick="closePanel()" aria-label="${S.close}">×</button>
    <div class="era-tag" style="color:${ERAS[b.era][1]}">${ERAS[b.era][0]} · ${d.war}</div>
    <h2>${b.name}</h2>
    <div class="meta">${b.date} · ${b.place}</div>
    <p class="hook">${d.hook}</p>
    <div class="sides">${side(b.a, "a", b.winner === "a")}${side(b.b, "b", b.winner === "b")}</div>
    ${known ? `<div class="strength"><div style="width:${pa}%"></div><div style="width:${100 - pa}%"></div></div><div class="note">${S.sizes}</div>` : ""}
    <nav class="toc">${d.chapters.map(c => `<a href="#" data-ch="${c.n}"><b>${c.n}</b> ${c.title}</a>`).join("")}</nav>
    ${d.chapters.map(c => `<section class="chapter" id="ch${c.n}"><h3><span>${c.n}</span>${c.title}</h3>${c.blocks.map(renderBlock).join("")}</section>`).join("")}
    ${conn.length ? `<h3>${S.linked}</h3><div class="links">${conn.map(c => `<button onclick="openBattle('${c.id}')">${c.name} · ${fmtYear(c.year)}</button>`).join("")}</div>` : ""}
    ${ft ? `<h3>${S.sources}</h3><ul class="src">${ft.sources.map(([t, u]) => `<li>${u ? `<a href="${u}" target="_blank" rel="noopener">${t}</a>` : t}</li>`).join("")}</ul>` : ""}
    <div class="navb">
      <button ${prev ? "" : "disabled"} onclick="openBattle('${prev}')">${S.prev}</button>
      <button ${next ? "" : "disabled"} onclick="openBattle('${next}')">${S.next}</button>
    </div>
    <div id="gpop" class="gpop hidden"></div>`;
  $("panel").classList.add("open");
  document.body.classList.add("po");
  $("panel").scrollTop = 0;
  if (FORMATIONS[id]) drawFormation(b, FORMATIONS[id]);
  history.replaceState(null, "", "#" + id);
  $("panel").querySelectorAll(".toc a").forEach(a => a.onclick = e => {
    e.preventDefault(); document.getElementById("ch" + a.dataset.ch).scrollIntoView({ behavior: "smooth" });
  });
}
// Glossary popup: tap a term to read it, tap anywhere else to close.
document.addEventListener("click", e => {
  const pop = document.getElementById("gpop"); if (!pop) return;
  const t = e.target.closest(".term");
  if (!t) { pop.classList.add("hidden"); return; }
  pop.innerHTML = `<b>${t.textContent}</b>${GLOSSARY[t.dataset.k]}`;
  const r = t.getBoundingClientRect(), pr = $("panel").getBoundingClientRect();
  pop.style.top = (r.bottom - pr.top + $("panel").scrollTop + 6) + "px";
  pop.classList.remove("hidden");
});

// A battle seeded from Wikidata: basic facts, plus the Wikipedia summary loaded live, with credit.
function renderBasic(b) {
  stopPlay();
  const list = visible(), i = list.findIndex(x => x.id === b.id);
  const prev = i > 0 ? list[i - 1].id : "", next = i >= 0 && i < list.length - 1 ? list[i + 1].id : "";
  const [lang, title] = b.wiki || [];
  const url = title ? `https://${lang}.wikipedia.org/wiki/${encodeURIComponent(title)}` : "";
  $("panel").innerHTML = `
    <button id="close" onclick="closePanel()" aria-label="${S.close}">×</button>
    <div class="era-tag" style="color:${ERAS[b.era][1]}">${ERAS[b.era][0]}</div>
    <h2>${b.name}</h2>
    <div class="meta">${b.date} · ${b.place}</div>
    ${b.war ? `<div class="fact-row"><b>${S.war}</b>${b.war}</div>` : ""}
    ${b.parts.length ? `<div class="fact-row"><b>${S.parts}</b>${b.parts.join(" · ")}</div>` : ""}
    <div id="wiki" class="wiki">${title ? S.wikiLoading : ""}</div>
    ${url ? `<a class="more" target="_blank" rel="noopener" href="${url}">${S.wikiFull}</a>` : ""}
    <div class="unchecked">${S.basicNote}</div>
    <div class="navb">
      <button ${prev ? "" : "disabled"} onclick="openBattle('${prev}')">${S.prev}</button>
      <button ${next ? "" : "disabled"} onclick="openBattle('${next}')">${S.next}</button>
    </div>`;
  $("panel").classList.add("open");
  document.body.classList.add("po");
  $("panel").scrollTop = 0;
  history.replaceState(null, "", "#" + b.id);
  if (!title) return;
  fetch(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`)
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(j => {
      if (state.current !== b.id) return;   // the reader already moved on
      const box = $("wiki"); box.textContent = "";
      if (j.thumbnail) { const img = new Image(); img.src = j.thumbnail.source; img.alt = ""; box.append(img); }
      const para = document.createElement("p"); para.textContent = j.extract || S.wikiNone; box.append(para);
      const credit = document.createElement("small");
      credit.textContent = S.wikiCredit(lang === "en");
      box.append(credit);
    })
    .catch(() => { if (state.current === b.id) $("wiki").textContent = S.wikiFail; });
}

// Phones: swipe the battle sheet down to close it and go back to the full map.
// The swipe starts only when the sheet is scrolled to the top, so reading the text still scrolls normally.
(() => {
  const panel = $("panel"), phone = matchMedia("(max-width:760px)");
  let y0 = null, x0 = 0, t0 = 0, dy = 0, dragging = false;
  panel.addEventListener("touchstart", e => {
    y0 = null;
    if (!phone.matches || e.touches.length !== 1 || panel.scrollTop > 0) return;
    if (e.target.closest(".field, #formation.theater, input, textarea")) return;
    y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; t0 = Date.now(); dy = 0; dragging = false;
  }, { passive: true });
  panel.addEventListener("touchmove", e => {
    if (y0 === null) return;
    const t = e.touches[0], d = t.clientY - y0;
    if (!dragging) {
      // Decide once: a downward, mostly vertical move from the top becomes a drag; anything else is left alone.
      if (Math.abs(d) < 8 && Math.abs(t.clientX - x0) < 8) return;
      if (d <= 0 || Math.abs(t.clientX - x0) > Math.abs(d) || panel.scrollTop > 0) { y0 = null; return; }
      dragging = true; panel.classList.add("drag");
    }
    dy = Math.max(0, d);
    panel.style.transform = `translateY(${dy}px)`;
    e.preventDefault();
  }, { passive: false });
  const end = () => {
    if (y0 === null) return;
    y0 = null;
    if (!dragging) return;
    dragging = false; panel.classList.remove("drag"); panel.style.transform = "";
    const fast = dy > 40 && dy / Math.max(1, Date.now() - t0) > 0.5;
    if (dy > panel.offsetHeight * 0.25 || fast) closePanel();
  };
  panel.addEventListener("touchend", end); panel.addEventListener("touchcancel", end);
})();

function closePanel() {
  $("panel").classList.remove("open");
  document.body.classList.remove("po");
  stopPlay();
  if (state.current) markers[state.current].setIcon(pinIcon(byId[state.current], false));
  document.querySelectorAll(".item.sel, .dot.sel").forEach(i => i.classList.remove("sel"));
  state.current = null;
  history.replaceState(null, "", location.pathname + location.search);
}

// ---------- Deployment diagram ----------
let playTimer = null;
function stopPlay() { clearInterval(playTimer); playTimer = null; }

const KIND_ORDER = ["inf", "cav", "art", "tank", "air", "ship", "ele", "car", "camp"];
function unitShape(u) {
  const x = -u.w / 2, y = -u.h / 2, c = `shape ${u.s}`;
  if (u.k === "air") return `<path class="${c}" d="M${x} ${-y}L0 ${y}L${-x} ${-y}L0 ${-y * 0.4}Z"/>`;
  if (u.k === "tank") return `<rect class="${c}" x="${x}" y="${y}" width="${u.w}" height="${u.h}" rx=".5"/><ellipse class="mark" rx="${u.w * 0.32}" ry="${u.h * 0.27}"/>`;
  if (u.k === "art") return `<rect class="${c}" x="${x}" y="${y}" width="${u.w}" height="${u.h}" rx=".5"/><circle class="mark dot" r="${Math.min(u.w, u.h) * 0.24}"/>`;
  if (u.k === "ship") return `<ellipse class="${c}" rx="${u.w / 2}" ry="${u.h / 2}"/>`;
  if (u.k === "ele") return `<rect class="${c}" x="${x}" y="${y}" width="${u.w}" height="${u.h}" rx="${u.h / 2}"/>`;
  if (u.k === "car") return `<rect class="${c}" x="${x}" y="${y}" width="${u.w}" height="${u.h}" stroke-dasharray="1.2 .8"/>`;
  if (u.k === "camp") return `<rect class="${c}" x="${x}" y="${y}" width="${u.w}" height="${u.h}" fill-opacity=".45" stroke-dasharray="1 1"/>`;
  const rect = `<rect class="${c}" x="${x}" y="${y}" width="${u.w}" height="${u.h}" rx=".5"/>`;
  // Cavalry carries a diagonal, as on military maps.
  return u.k === "cav" ? rect + `<line class="mark" x1="${x}" y1="${-y}" x2="${-x}" y2="${y}"/>` : rect;
}

function drawFormation(b, f) {
  stopPlay();
  // Resolve each step into full positions: units keep their last position and stay routed once routed.
  const frames = []; let pos = {}, gone = new Set();
  f.steps.forEach(s => { pos = { ...pos, ...s.p }; (s.x || []).forEach(id => gone.add(id)); frames.push({ pos, gone: new Set(gone), t: s.t }); });

  const terrain = (f.terrain || []).map(t =>
    t.t === "sea" ? `<rect x="${t.x}" y="${t.y}" width="${t.w}" height="${t.h}" fill="#b9cfd9"/><text class="ter" x="${t.x + t.w / 2}" y="${t.y + t.h / 2 + 1}">${t.l}</text>` :
    t.t === "hill" ? `<ellipse cx="${t.x}" cy="${t.y}" rx="${t.rx}" ry="${t.ry}" fill="#dccb98" stroke="#b9a66c" stroke-width=".3"/><text class="ter" x="${t.x}" y="${t.y - t.ry + 3.5}">${t.l}</text>` :
    `<text class="ter" x="${t.x}" y="${t.y}">${t.l}</text>`).join("");

  $("formation").innerHTML = `
    <svg class="field" viewBox="-8 -2 116 76" role="img" aria-label="${S.diagramOf(b.name)}">
      ${terrain}
      <defs>
        <marker id="ah-a" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L6 3L0 6z" class="a"/></marker>
        <marker id="ah-b" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L6 3L0 6z" class="b"/></marker>
      </defs>
      <g id="ghosts"></g>
      ${f.units.map(u => `<g class="u" data-u="${u.id}">${unitShape(u)}</g>`).join("")}
      <g id="arrows"></g>
      ${f.units.filter(u => u.l).map(u => `<text class="u lab" data-l="${u.id}">${u.l}</text>`).join("")}
    </svg>
    <div class="cap" id="cap"></div>
    <div class="ctl">
      <button id="stepPrev" aria-label="${S.stepPrev}">◀</button>
      ${frames.map((_, k) => `<button data-step="${k}">${k + 1}</button>`).join("")}
      <button id="stepNext" aria-label="${S.stepNext}">▶</button>
      <span class="sp"></span>
      <button id="play">${S.play}</button>
    </div>
    <div class="legend"><span><b style="color:var(--blue)">■</b> ${b.a.side}</span><span><b style="color:var(--red)">■</b> ${b.b.side}</span>${
      KIND_ORDER.filter(k => f.units.some(u => u.k === k)).map(k => `<span><svg class="lg" viewBox="-5.5 -3.2 11 6.4">${unitShape({ k, w: 9, h: 4.4, s: "n" })}</svg>${S.kinds[k]}</span>`).join("")
    }<br>${S.arrows} · ${S.scale}</div>
    <div class="recon">${S.recon(b.year)}</div>`;

  const units = Object.fromEntries(f.units.map(u => [u.id, u]));
  let step = 0;
  function show(k) {
    step = k;
    const fr = frames[k];
    document.querySelectorAll("#formation [data-u]").forEach(g => {
      const [x, y, r = 0] = fr.pos[g.dataset.u];
      g.style.transform = `translate(${x}px, ${y}px) rotate(${r}deg)`;
      g.classList.toggle("gone", fr.gone.has(g.dataset.u));
    });
    document.querySelectorAll("#formation [data-l]").forEach(t => {
      const u = units[t.dataset.l], [x, y, r = 0] = fr.pos[u.id];
      // Labels sit under the unit; a rotated unit is as tall as it was wide.
      const half = Math.abs(r) > 45 ? u.w / 2 : u.h / 2;
      t.style.transform = `translate(${x}px, ${y + half + 3}px)`;
      t.classList.toggle("gone", fr.gone.has(u.id));
    });
    // Arrows and ghost outlines: where each unit that moved was standing in the previous step.
    let arrows = "", ghosts = "";
    if (k > 0) f.units.forEach(u => {
      const [x0, y0, r0 = 0] = frames[k - 1].pos[u.id], [x1, y1] = fr.pos[u.id], dist = Math.hypot(x1 - x0, y1 - y0);
      if (dist < 4 || frames[k - 1].gone.has(u.id)) return;
      // Stop the arrow short of the unit, so the head is not hidden under it.
      const cut = Math.min(dist - 2, Math.min(u.w, u.h) / 2 + 1.5), ex = x1 - (x1 - x0) / dist * cut, ey = y1 - (y1 - y0) / dist * cut;
      arrows += `<line class="arrow ${u.s}" x1="${x0}" y1="${y0}" x2="${ex}" y2="${ey}" marker-end="url(#ah-${u.s})"/>`;
      ghosts += `<rect class="ghost ${u.s}" x="${-u.w / 2}" y="${-u.h / 2}" width="${u.w}" height="${u.h}" transform="translate(${x0} ${y0}) rotate(${r0})"/>`;
    });
    document.querySelector("#formation #arrows").innerHTML = arrows;
    document.querySelector("#formation #ghosts").innerHTML = ghosts;
    $("cap").innerHTML = `<b style="color:var(--gold)">${S.stepOf(k + 1, frames.length)}</b> ${fr.t}`;
    $("stepPrev").disabled = k === 0; $("stepNext").disabled = k === frames.length - 1;
    document.querySelectorAll("#formation [data-step]").forEach(bn => bn.classList.toggle("on", +bn.dataset.step === k));
  }
  document.querySelectorAll("#formation [data-step]").forEach(bn => bn.onclick = () => { stopPlay(); $("play").textContent = S.play; show(+bn.dataset.step); });
  const manual = k => { stopPlay(); $("play").textContent = S.play; show(k); };
  $("stepPrev").onclick = () => manual(Math.max(0, step - 1));
  $("stepNext").onclick = () => manual(Math.min(frames.length - 1, step + 1));
  $("play").onclick = () => {
    if (playTimer) { stopPlay(); $("play").textContent = S.play; return; }
    $("play").textContent = S.pause;
    show(0);
    playTimer = setInterval(() => {
      if (step >= frames.length - 1) { stopPlay(); $("play").textContent = S.play; return; }
      show(step + 1);
    }, 3200);
  };
  show(0);
}

// ---------- Start ----------
$("title").textContent = S.title; $("sub").textContent = S.sub; $("q").placeholder = S.search;
$("random").textContent = S.random; $("menu").textContent = S.menu; $("lang").textContent = S.other;
$("lang").onclick = () => { location.href = location.pathname + "?lang=" + (LANG === "pt" ? "en" : "pt") + location.hash; };
refresh(false);
Analytics.track("$pageview", { lang: LANG });
const start = location.hash.slice(1);
if (byId[start]) openBattle(start);
window.addEventListener("hashchange", () => { const id = location.hash.slice(1); if (byId[id] && id !== state.current) openBattle(id); });
</script>
</body>
